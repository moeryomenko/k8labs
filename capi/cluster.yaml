# k8labs declarative CAPI assets — the workload Cluster and every object its
# ClusterClass references, rendered once from
# cluster-api-hypervisor/templates/cluster-template.yaml with the concrete
# lab values documented by that template's twin,
# cluster-api-hypervisor/templates/cluster-example.yaml:
#
#   CLUSTER_NAME                = k8labs
#   NAMESPACE                   = default
#   KUBERNETES_VERSION          = v1.32.13
#     (the kubelet and kubernetes-cp pins in extensions/manifest.yaml)
#   CONTROL_PLANE_MACHINE_COUNT = 1
#   WORKER_MACHINE_COUNT        = 3
#
# Derivation note (2026-08-24): after CAPH added the HypervisorClusterTemplate,
# HypervisorControlPlaneTemplate, and HypervisorConfigTemplate API kinds, the
# ClusterClass infrastructure/controlPlane/bootstrap refs switched from the
# concrete HypervisorCluster/HypervisorControlPlane/HypervisorConfig kinds to
# their Template counterparts, and this manifest now carries those three
# template objects (mirroring clusterclass.yaml + cluster-example.yaml) instead
# of the concrete ones. The topology controller clones each template into a
# per-cluster concrete object.
#
# Machine sizes carry the build/deploy.tfvars defaults into the
# HypervisorMachineTemplate specs the ClusterClass references: control-plane
# cpu 2 / ram 2048MiB / disk 20480MiB; workers cpu 2 / ram 4096MiB /
# disk 40960MiB (the common worker shape; w2's extra vCPU is a per-node
# upscale the shared MachineDeployment template cannot express).
#
# Apply order is document order: ClusterClass first, then the referenced
# templates, then the topology Cluster.
---
# ClusterClass — verbatim from
# cluster-api-hypervisor/templates/clusterclass.yaml.
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: hypervisor-cluster-template
  namespace: default
spec:
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: HypervisorClusterTemplate
      name: hypervisor-cluster
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1alpha1
      kind: HypervisorControlPlaneTemplate
      name: hypervisor-control-plane-template
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: HypervisorMachineTemplate
        name: hypervisor-control-plane-machine-template
  workers:
    machineDeployments:
      - class: default-worker
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1alpha1
            kind: HypervisorConfigTemplate
            name: hypervisor-worker-bootstrap-template
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: HypervisorMachineTemplate
            name: hypervisor-worker-machine-template
---
# HypervisorClusterTemplate referenced by the ClusterClass infrastructure
# ref. Network values are the lab host network: bridge k8sbr0 on
# 192.168.124.0/24 with gateway/DNS 192.168.124.1, NAT in the inet k8slab
# nftables table.
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: HypervisorClusterTemplate
metadata:
  name: hypervisor-cluster
  namespace: default
spec:
  template:
    spec:
      network:
        cidr: 192.168.124.0/24
        gateway: 192.168.124.1
        dnsIP: 192.168.124.1
        bridgeName: k8sbr0
        natTable: k8slab
---
# HypervisorControlPlaneTemplate referenced by the ClusterClass controlPlane
# ref. Replicas and version are intentionally unset here: the Cluster topology
# controls both on the cloned object (topology.controlPlane.replicas and
# topology.version).
apiVersion: controlplane.cluster.x-k8s.io/v1alpha1
kind: HypervisorControlPlaneTemplate
metadata:
  name: hypervisor-control-plane-template
  namespace: default
spec:
  template:
    spec:
      machineTemplate:
        spec:
          infrastructureRef:
            apiGroup: infrastructure.cluster.x-k8s.io
            kind: HypervisorMachineTemplate
            name: hypervisor-control-plane-machine-template
---
# Control-plane machine shape from build/deploy.tfvars control_plane defaults.
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: HypervisorMachineTemplate
metadata:
  name: hypervisor-control-plane-machine-template
  namespace: default
spec:
  template:
    spec:
      cpu: 2
      ram: 2048
      disk: 20480
---
# Worker bootstrap config template referenced by the default-worker class.
# The HypervisorControlPlane controller renders per-node bootstrap data at
# runtime; role pins this template to worker nodes.
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha1
kind: HypervisorConfigTemplate
metadata:
  name: hypervisor-worker-bootstrap-template
  namespace: default
spec:
  template:
    spec:
      clusterName: k8labs
      role: worker
---
# Worker machine shape from build/deploy.tfvars worker defaults (ram/disk are
# identical across w1/w2; cpu takes w1's 2 as the shared baseline).
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: HypervisorMachineTemplate
metadata:
  name: hypervisor-worker-machine-template
  namespace: default
spec:
  template:
    spec:
      cpu: 2
      ram: 4096
      disk: 40960
---
# The workload Cluster. The cluster-name label lets the capi/addons/
# ClusterResourceSets target this cluster via their clusterSelector.
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: k8labs
  namespace: default
  labels:
    cluster.x-k8s.io/cluster-name: k8labs
spec:
  topology:
    classRef:
      name: hypervisor-cluster-template
    version: v1.32.13
    controlPlane:
      replicas: 1
    workers:
      machineDeployments:
        - name: md-0
          class: default-worker
          replicas: 3
