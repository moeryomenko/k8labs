# Resource-set Secret embedding the coredns/ manifests.
#
# data keys are the top-level coredns/*.yaml filenames; values are
# those files' exact bytes, base64-encoded. Payload fidelity against
# coredns/ is enforced by tests/test_capi_assets.py (normalized
# YAML-equality).

apiVersion: v1
kind: Secret
metadata:
  name: coredns-manifests
  namespace: default
type: addons.cluster.x-k8s.io/resource-set
data:
  corefile-configmap.yaml: 
  deployment.yaml: 
  rbac.yaml: 
  service.yaml: 
