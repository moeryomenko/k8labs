# Resource-set Secret embedding the rbac/ manifests.
#
# data keys are the top-level rbac/*.yaml filenames; values are
# those files' exact bytes, base64-encoded. Payload fidelity against
# rbac/ is enforced by tests/test_capi_assets.py (normalized
# YAML-equality).

apiVersion: v1
kind: Secret
metadata:
  name: rbac-manifests
  namespace: default
type: addons.cluster.x-k8s.io/resource-set
data:
  00-kubelet-bootstrap.yaml: 
  01-system-nodes.yaml: 
  02-system-admin.yaml: 
  03-kube-apiserver-proxy.yaml: 
