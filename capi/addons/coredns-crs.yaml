# ClusterResourceSet applying the coredns/ manifests to k8labs.
#
# The selector matches the cluster-name label carried by the Cluster in
# capi/cluster.yaml.

apiVersion: addons.cluster.x-k8s.io/v1beta1
kind: ClusterResourceSet
metadata:
  name: coredns-crs
  namespace: default
spec:
  clusterSelector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: k8labs
  resources:
    - apiVersion: v1
      kind: Secret
      name: coredns-manifests
