# Resource-set Secret embedding the cilium/ manifests.
#
# data keys are the top-level cilium/*.yaml filenames; values are
# those files' exact bytes, base64-encoded. Payload fidelity against
# cilium/ is enforced by tests/test_capi_assets.py (normalized
# YAML-equality).

apiVersion: v1
kind: Secret
metadata:
  name: cilium-manifests
  namespace: default
type: addons.cluster.x-k8s.io/resource-set
data:
  gateway-class-config.yaml: 
  gateway.yaml: 
  gatewayclass.yaml: 
  http-route.yaml: 
  l2-policy.yaml: 
  lb-pool.yaml: YXBpVmVyc2lvbjogY2lsaXVtLmlvL3YyCmtpbmQ6IENpbGl1bUxvYWRCYWxhbmNlcklQUG9vbAptZXRhZGF0YToKICBuYW1lOiBsYi1wb29sCnNwZWM6CiAgYmxvY2tzOgogICAgLSBjaWRyOiAiMTAuMC4xMC4wLzI0Igo=
