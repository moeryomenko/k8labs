# ClusterResourceSet applying the cilium/ manifests to k8labs.
#
# The selector matches the cluster-name label carried by the Cluster in
# capi/cluster.yaml.
#
# The install tree (cilium/install/) exceeds the ~1MiB Kubernetes Secret
# limit, so its payloads are split across cilium-install-manifests-{1..4};
# every referenced Secret also embeds the top-level cilium/*.yaml manifests.

apiVersion: addons.cluster.x-k8s.io/v1beta1
kind: ClusterResourceSet
metadata:
  name: cilium-crs
  namespace: default
spec:
  clusterSelector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: k8labs
  resources:
    - apiVersion: v1
      kind: Secret
      name: cilium-manifests
    - apiVersion: v1
      kind: Secret
      name: cilium-install-manifests-1
    - apiVersion: v1
      kind: Secret
      name: cilium-install-manifests-2
    - apiVersion: v1
      kind: Secret
      name: cilium-install-manifests-3
    - apiVersion: v1
      kind: Secret
      name: cilium-install-manifests-4
