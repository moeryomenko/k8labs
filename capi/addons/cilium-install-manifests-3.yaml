# Resource-set Secret carrying part of the cilium/install/ tree for the
# cilium-crs ClusterResourceSet (REVIEW-R1 Finding 4b). Kubernetes caps a
# single Secret at ~1MiB and the install tree exceeds it, so the payloads
# are split across cilium-install-manifests-{{1..4}}; every Secret also
# embeds the top-level cilium/*.yaml manifests required of any Secret
# referenced by the CRS. Each install file appears in exactly one Secret;
# payload fidelity is enforced by tests/test_capi_assets.py (normalized
# YAML-equality).
---
apiVersion: v1
kind: Secret
metadata:
  name: cilium-install-manifests-3
  namespace: default
type: addons.cluster.x-k8s.io/resource-set
data:
  echo-service.yaml: 
  gateway-class-config.yaml: 
  gateway.yaml: 
  gatewayclass.yaml: 
  http-route.yaml: 
  install--00-crds--ciliumnetworkpolicies.yaml: 
  l2-policy.yaml: 
  lb-pool.yaml: YXBpVmVyc2lvbjogY2lsaXVtLmlvL3YyCmtpbmQ6IENpbGl1bUxvYWRCYWxhbmNlcklQUG9vbAptZXRhZGF0YToKICBuYW1lOiBsYi1wb29sCnNwZWM6CiAgYmxvY2tzOgogICAgLSBjaWRyOiAiMTAuMC4xMC4wLzI0Igo=
  metrics-server.yaml: 
