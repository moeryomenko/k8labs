apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
containerRuntimeEndpoint: unix:///var/run/crio/crio.sock
cgroupDriver: systemd
failSwapOn: false
staticPodPath: ""
# clusterDNS: pods resolve via the CoreDNS kube-dns Service (10.96.0.10).
clusterDNS:
  - 10.96.0.10
# clusterDomain must match the kube-dns Service search domain (see plan assumption log)
clusterDomain: cluster.local
authentication:
  anonymous:
    enabled: false
  webhook:
    enabled: true
  x509:
    # CA ships at /etc/kubernetes/pki/ca.pem via the z-kubelet-<node> runtime
    # confext. The former /var/lib path for this file was
    # unreachable: confext merges into /etc ONLY, so that path was
    # never populated and kubelet crash-looped.
    clientCAFile: /etc/kubernetes/pki/ca.pem
authorization:
  mode: Webhook
healthzBindAddress: 0.0.0.0
healthzPort: 10248
logging:
  format: text
