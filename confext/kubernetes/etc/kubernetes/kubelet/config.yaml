apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
containerRuntimeEndpoint: unix:///var/run/crio/crio.sock
cgroupDriver: systemd
failSwapOn: false
# clusterDNS: pods resolve via the CoreDNS kube-dns Service (10.96.0.10).
# Keep in sync with twin template: ansible/roles/kubelet/templates/config.yaml.j2
clusterDNS:
  - 10.96.0.10
# clusterDomain must match the kube-dns Service search domain (see plan assumption log)
clusterDomain: cluster.local
authentication:
  anonymous:
    enabled: false
  webhook:
    enabled: true
  x509:
    clientCAFile: /var/lib/kubelet/pki/ca.pem
authorization:
  mode: Webhook
healthzBindAddress: 0.0.0.0
healthzPort: 10248
logging:
  format: text
