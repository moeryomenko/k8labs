# CRI-O daemon configuration
# Managed by systemd-confext — do not edit directly on the node.

[crio]
  [crio.api]
    listen = "/var/run/crio/crio.sock"

  [crio.runtime]
    default_runtime = "crun"
    pause_image = "registry.k8s.io/pause:3.9"
    conmon = "/usr/bin/conmon"
    log_level = "info"

  [crio.network]
    # /etc/cni/net.d is not usable: /etc is read-only once confexts merge
    # (spec Ambiguity Resolution #2), so cri-o could never mkdir it
    # and Cilium could never write its 05-cilium.conflist. /run is a writable
    # tmpfs; cri-o creates /run/cni/net.d itself at startup.
    network_dir = "/run/cni/net.d"
    # Plugin binaries come from the cni sysext (/usr/lib/cni, merged into the
    # read-only /usr) plus /run/cni/bin where Cilium's install-cni-binaries
    # init container drops cilium-cni (/opt/cni/bin is read-only
    # after the sysext merge and SELinux-labeled usr_t, so it was relocated
    # to the writable /run tmpfs alongside /run/cni/net.d).
    plugin_dirs = [
      "/usr/lib/cni",
      "/run/cni/bin",
    ]
