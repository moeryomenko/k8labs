# k8s-labs container registry configuration
# Allow pulling from Docker Hub with short-name resolution
unqualified-search-registries = ["docker.io"]

[[registry]]
prefix = "docker.io"
location = "docker.io"
insecure = false
blocked = false

# Local insecure registry on the KVM host for workload images
[[registry]]
location = "192.168.124.1:5000"
insecure = true
