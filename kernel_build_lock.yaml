# Reproducible kernel build lock for the linux-sched cgroup-v2 quota campaign.
#
# This file records pins and inputs only. Artifact hashes are recorded after a
# build produces the artifact; a hash is never written for something that has
# not been built.
schema_version: 1
kind: kernel-build-lock

# Exact upstream source (linux-next tag next-20261016). Verified to contain
# BPF_F_ARENA_SCALAR and sched_ext_ops.sub_cid_sched_updated().
source_repo: https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git
source_tag: next-20261016
source_commit: 2efb7a11f1aa4d2dc285fe2680cca22cb9f72f64

# Fedora packaging tree, pinned to an immutable commit (never the branch tip).
kernel_ark_repo: https://gitlab.com/cki-project/kernel-ark.git
kernel_ark_branch: ark-infra
ark_infra_commit: 858721d1e05149394e01ae4f5ce3202484c22850

# Digest-pinned builder and RPM buildroot.
fedora_version: '44'
fedora_image: registry.fedoraproject.org/fedora@sha256:10667e171df877cedd245b7065238143e09eaae7da4656d3e62eb7c094378011
fedora_image_digest: sha256:10667e171df877cedd245b7065238143e09eaae7da4656d3e62eb7c094378011
mock_buildroot: fedora-44-x86_64
architecture: x86_64

# Merged configuration fragment and the NVR derived from source + fragment.
# Verified against the SRPM the build emitted:
#   kernel-7.3.0-0.0.next.20261016.64.k8.46c58e1.fc44.src.rpm
config_fragment: configs/fedora-44-kernel.config-fragment
config_fragment_sha256: 46c58e1ac6d6a7162a38f31d42ffeda13e5820e800add2dff49dd03505b59497
nvr: kernel-7.3.0-0.0.next.20261016.64.k8.46c58e1.fc44
dist_localversion: .k8.46c58e1
ark_rhel_release: '64'

# Release policy: two clean payload builds are compared before one
# operator-approved HSM-signed release is produced.
clean_builds_required: 2
hsm_signature_required: true
operator_approval_required: true

# rpmbuild switches for the release build. `--without debuginfo` must never be
# added: the spec strips every CONFIG_DEBUG_INFO*=y, which drops
# CONFIG_DEBUG_INFO_BTF and, with it, CONFIG_SCHED_CLASS_EXT.
rpmbuild_opts:
  - --without debug
  - --without doc
  - --without headers
  - --without cross_headers
  - --without perf
  - --without libperf
  - --without tools
  - --without ynl
  - --without kmap
  - --without kernel_abi_stablelists
  - --without selftests
forbidden_rpmbuild_opts:
  - --without debuginfo

# Only these four runtime RPMs are tracked in Git LFS.
lfs_tracked_rpms:
  - kernel-core
  - kernel-modules
  - kernel-modules-core
  - kernel-modules-extra

# Artifacts that stay outside Git LFS. Their hashes are filled in by the build;
# null means "not built yet", which is not a verified hash.
non_lfs_artifacts:
  - id: source-tarball
    path: build/firmware/kernel-source.tar.xz
    sha256: null
  - id: firmware
    path: build/firmware/k8labs-cloudhv-secureboot.fd
    sha256: null
  - id: debuginfo
    path: build/firmware/kernel-debuginfo.rpm
    sha256: null

# rpm 6 does not honour SOURCE_DATE_EPOCH for %{BUILDTIME}; pin it through the
# rpm macros, and normalise tar metadata for the kABI stablelists tarball.
# Verified: two independent SRPM builds produced the same sha256
# 0fda80a724f22148a313e42970f2cacbd2f734dce1ee7a2f520c2df2916ede67.
reproducible_build:
  build_epoch: 1792368000
  rpm_macro: "%_buildtime 1792368000"
  kbuild_build_timestamp: "Mon Oct 19 00:00:00 UTC 2026"
  kbuild_build_user: k8labs
  kbuild_build_host: k8labs-build
  tar_options: "--mtime=@1792368000 --owner=0 --group=0 --numeric-owner --sort=name"
  srpm_sha256: "1fb5c09b634250e349a780af5b3933f44f9f0e16090c0dd623c0a0033aa99cff"
  # The module-signing key is fixed through CONFIG_MODULE_SIG_KEY and shipped in
  # the source tree, so module packages and the embedded certificate are stable.
  # The key pair lives outside the repository (no private key material in Git);
  # the source package embeds it, so the SRPM hash commits to the key.
  module_signing_key: kernel-campaign/keys/k8labs-module-signing.pem
  module_signing_cert_sha256: "23e04b0d4c316e4cfacbec054a882071191f0f86a23bf11fc920aee682f88999"
  remaining_variance: none-expected
