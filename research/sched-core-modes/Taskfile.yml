# k8labs sched-core-modes research series Taskfile
#
# Controlled cgroup-v2 experiment for the five cgroup_mode values:
# up, smp, concur, max, tasks. The measured target is a lab worker reached
# through the control-plane VM; results are pulled back to the host data root.
# See README.md for the protocol and the interpretation limits.
version: '3'

vars:
  PROJECT_ROOT:
    sh: git rev-parse --show-toplevel 2>/dev/null || pwd
  SCHED_CORE_MODES_DIR: '{{.TASKFILE_DIR}}'
  SCHED_CORE_MODES_EXPERIMENTS: '{{.SCHED_CORE_MODES_DIR}}/experiments'
  SCHED_CORE_MODES_TESTS: '{{.SCHED_CORE_MODES_DIR}}/tests'
  SCHED_CORE_MODES_RUNNER: '{{.SCHED_CORE_MODES_EXPERIMENTS}}/run-matrix.sh'
  SCHED_CORE_MODES_ANALYZER: '{{.SCHED_CORE_MODES_EXPERIMENTS}}/analyze.py'
  SCHED_CORE_MODES_DATA_ROOT:
    sh: |
      if [ -n "${SCHED_CORE_MODES_DATA_ROOT:-}" ]; then
        printf '%s' "$SCHED_CORE_MODES_DATA_ROOT"
      elif [ -n "${K8LABS_RESEARCH_DATA_ROOT:-}" ]; then
        printf '%s/sched-core-modes' "$K8LABS_RESEARCH_DATA_ROOT"
      else
        printf '%s/build/research/sched-core-modes' "{{.PROJECT_ROOT}}"
      fi
  SCHED_CORE_MODES_RUN_DIR_RAW: '{{.SCHED_CORE_MODES_RUN_DIR | default ""}}'
  SCHED_CORE_MODES_RUN_DIR: '{{if .SCHED_CORE_MODES_RUN_DIR_RAW}}{{if hasPrefix "/" .SCHED_CORE_MODES_RUN_DIR_RAW}}{{.SCHED_CORE_MODES_RUN_DIR_RAW}}{{else}}{{.PROJECT_ROOT}}/{{.SCHED_CORE_MODES_RUN_DIR_RAW}}{{end}}{{else}}{{.SCHED_CORE_MODES_DATA_ROOT}}/latest{{end}}'
  SCHED_CORE_MODES_ANALYSIS_DIR: '{{.SCHED_CORE_MODES_RUN_DIR}}/analysis'
  PROFILE: '{{.PROFILE | default "pilot"}}'

tasks:
  sched-core-modes-setup:
    desc: Verify worker SSH, kernel, cgroup v2, debugfs and tools
    env: &runner-env
      WORKER: '{{.WORKER | default ""}}'
      RUN_ID: '{{.RUN_ID | default ""}}'
      REPS: '{{.REPS | default ""}}'
      DURATION: '{{.DURATION | default ""}}'
      WARMUP: '{{.WARMUP | default ""}}'
      COOLDOWN: '{{.COOLDOWN | default ""}}'
      SCENARIOS: '{{.SCENARIOS | default ""}}'
      MODES: '{{.MODES | default ""}}'
      PARENT_WEIGHT: '{{.PARENT_WEIGHT | default ""}}'
      DATA_ROOT: '{{.DATA_ROOT | default ""}}'
      CP_HOST: '{{.CP_HOST | default ""}}'
      CP_PORT: '{{.CP_PORT | default ""}}'
      CP_KEY: '{{.CP_KEY | default ""}}'
      WORKER_KEY: '{{.WORKER_KEY | default ""}}'
      REMOTE_DIR: '{{.REMOTE_DIR | default ""}}'
    cmd: '"{{.SCHED_CORE_MODES_RUNNER}}" --setup'

  sched-core-modes-plan:
    desc: Print the seeded plan without changing the worker mode
    env: *runner-env
    cmd: '"{{.SCHED_CORE_MODES_RUNNER}}" --plan --profile "{{.PROFILE}}"'

  sched-core-modes-pilot:
    desc: Run a 1-rep, 3-second pilot matrix
    env: *runner-env
    cmd: '"{{.SCHED_CORE_MODES_RUNNER}}" --profile pilot'

  sched-core-modes-run:
    desc: Run the full 3-rep, 8-second matrix
    env: *runner-env
    cmd: '"{{.SCHED_CORE_MODES_RUNNER}}" --profile full'

  sched-core-modes-analyze:
    desc: Analyze the latest matrix into shares/metrics/summary
    cmd: |
      if [ ! -f "{{.SCHED_CORE_MODES_RUN_DIR}}/matrix.jsonl" ]; then
        echo "ERROR: no matrix.jsonl under {{.SCHED_CORE_MODES_RUN_DIR}}; run the pilot or full matrix first" >&2
        exit 1
      fi
      python3 "{{.SCHED_CORE_MODES_ANALYZER}}" \
        --matrix "{{.SCHED_CORE_MODES_RUN_DIR}}/matrix.jsonl" \
        --meta "{{.SCHED_CORE_MODES_RUN_DIR}}/meta.json" \
        --output-dir "{{.SCHED_CORE_MODES_ANALYSIS_DIR}}"
      echo "  Summary: {{.SCHED_CORE_MODES_ANALYSIS_DIR}}/summary.md"

  sched-core-modes-report:
    desc: Copy the latest analysis to the series RESULTS.md
    cmds:
      - task: sched-core-modes-analyze
      - cmd: |
          if [ ! -f "{{.SCHED_CORE_MODES_ANALYSIS_DIR}}/summary.md" ]; then
            echo "ERROR: analysis did not produce summary.md" >&2
            exit 1
          fi
          {
            echo "<!-- generated by task sched-core-modes-report -->"
            cat "{{.SCHED_CORE_MODES_ANALYSIS_DIR}}/summary.md"
          } > "{{.SCHED_CORE_MODES_DIR}}/RESULTS.md"
          echo "  Report: {{.SCHED_CORE_MODES_DIR}}/RESULTS.md"

  sched-core-modes-test:
    desc: Run offline tests and linters for the series
    cmd: |
      cd "{{.PROJECT_ROOT}}"
      uv run pytest -q "research/sched-core-modes/tests"
      python3 -m py_compile \
        "{{.SCHED_CORE_MODES_EXPERIMENTS}}/scenarios.py" \
        "{{.SCHED_CORE_MODES_EXPERIMENTS}}/run_matrix.py" \
        "{{.SCHED_CORE_MODES_EXPERIMENTS}}/analyze.py"
      bash -n "{{.SCHED_CORE_MODES_RUNNER}}"
      if command -v shellcheck >/dev/null 2>&1; then
        shellcheck "{{.SCHED_CORE_MODES_RUNNER}}"
      else
        echo "shellcheck not installed; skipped"
      fi

  sched-core-modes-k8s:
    desc: Run the optional Kubernetes QoS sanity jobs (NODE=<worker>)
    requires:
      vars: [NODE]
    preconditions:
      - sh: test -n "{{.NODE}}"
        msg: 'set NODE=<worker node name> (for example NODE=k8labs-md-custom-...)'
    cmd: |
      sed "s/__NODE_NAME__/{{.NODE}}/g" \
        "{{.SCHED_CORE_MODES_DIR}}/workloads/k8s-qos.yaml" \
        | kubectl --kubeconfig "{{.PROJECT_ROOT}}/build/kubeconfig" apply -f -
      kubectl --kubeconfig "{{.PROJECT_ROOT}}/build/kubeconfig" -n sched-core-modes \
        wait --for=condition=complete job -l sched-core-modes/run=qos --timeout=180s
      for job in qos-guaranteed qos-burstable qos-besteffort qos-quota; do
        echo "=== $job ==="
        kubectl --kubeconfig "{{.PROJECT_ROOT}}/build/kubeconfig" -n sched-core-modes \
          logs "job/$job" --tail=20 || true
      done

  sched-core-modes-k8s-clean:
    desc: Remove the optional Kubernetes QoS namespace
    cmd: kubectl --kubeconfig "{{.PROJECT_ROOT}}/build/kubeconfig" delete namespace sched-core-modes --ignore-not-found

  sched-core-modes-data-usage:
    desc: Show the data root size
    cmd: du -sh "{{.SCHED_CORE_MODES_DATA_ROOT}}" 2>/dev/null || echo "no data root yet"
