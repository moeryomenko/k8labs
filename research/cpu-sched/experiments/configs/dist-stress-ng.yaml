experiment:
  name: dist-stress-ng
  description: "Family A: stress-ng request x limit matrix — saturating 2-core control, shared 6-cell matrix. Must be run with --eevdf --perfetto --perfetto-config eevdf-deep."
replicates: 3
pre_warm: 10
duration: 90
cooldown: 10
node: w1
# Family A (dist-stress-ng): single stress-ng pod
# pinned to w1, the shared 6-cell request/limit matrix. Saturating control
# workload (2 cores, 100% load); no latency_load block (not an HTTP workload).
workload:
  type: stress-ng
  params:
    cores: 2
    load: 100
measurement:
  cgroup_interval: 5
matrix:
  - request: ""; limit: ""
  - request: "100m"; limit: "100m"
  - request: "100m"; limit: "1000m"
  - request: "500m"; limit: "500m"
  - request: "500m"; limit: "2000m"
  - request: "1000m"; limit: "2000m"
