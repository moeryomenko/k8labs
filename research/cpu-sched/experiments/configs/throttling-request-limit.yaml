experiment:
  name: throttling-request-limit
  description: "Vary request/limit ratios"
replicates: 3
pre_warm: 10
duration: 120
cooldown: 15
workload:
  type: cpu-burner
  params:
    endpoint: /fibonacci?n=38
measurement:
  cgroup_interval: 5
matrix:
  - request: "100m"; limit: "200m"
  - request: "100m"; limit: "500m"
  - request: "100m"; limit: "1000m"
  - request: "500m"; limit: "1000m"
  - request: "500m"; limit: "1500m"
  - request: "500m"; limit: "2000m"
  - request: "1000m"; limit: "2000m"
  - request: "1000m"; limit: "1000m"
