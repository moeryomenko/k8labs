experiment:
  name: throttling-limits
  description: "Sweep CPU limits with no requests"
replicates: 3
pre_warm: 10
duration: 120
cooldown: 15
workload:
  type: stress-ng
  params:
    cores: 2
    load: 100
measurement:
  cgroup_interval: 5
matrix:
  - request: ""
    limit: "100m"
  - request: ""
    limit: "250m"
  - request: ""
    limit: "500m"
  - request: ""
    limit: "750m"
  - request: ""
    limit: "1000m"
  - request: ""
    limit: "1500m"
  - request: "100m"
    limit: "1800m"
