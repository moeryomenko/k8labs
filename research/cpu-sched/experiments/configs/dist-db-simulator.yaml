experiment:
  name: dist-db-simulator
  description: "Family A: db-simulator request x limit matrix — OLTP query mix with periodic background checkpoints, shared 6-cell matrix. Must be run with --eevdf --perfetto --perfetto-config eevdf-deep."
replicates: 3
pre_warm: 10
duration: 90
cooldown: 10
node: w1
# Family A (dist-db-simulator): single
# db-simulator pod pinned to w1, the shared 6-cell request/limit matrix,
# latency_load with the db endpoint mix
# (select:40,insert:25,update:25,checkpoint:10). The pod's background
# checkpoint (default 30s interval) runs naturally during the window. The
# latency_load duration defaults to the experiment duration (90s).
workload:
  type: db-simulator
  params:
    latency_load:
      rate: 50
      endpoints: "select:40,insert:25,update:25,checkpoint:10"
measurement:
  cgroup_interval: 5
matrix:
  - request: ""; limit: ""
  - request: "100m"; limit: "100m"
  - request: "100m"; limit: "1000m"
  - request: "500m"; limit: "500m"
  - request: "500m"; limit: "2000m"
  - request: "1000m"; limit: "2000m"
