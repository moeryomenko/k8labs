experiment:
  name: eevdf-metrics-db
  description: "Combined api-server + db-simulator — EEVDF metrics under realistic microservice traffic"
replicates: 3
pre_warm: 20
duration: 120
cooldown: 20
measurement:
  cgroup_interval: 5
# Combined stack experiment:
# This config is REFERENCE ONLY — the combined deployment requires a custom setup
# not supported by run-experiment.sh's single-workload loop.
#
# Usage:
#   1. kubectl apply -f research/cpu-sched/workloads/combined/deploy.yaml
#   2. research/cpu-sched/experiments/load-generator.sh http://api-server:8080 --rate 50 --duration 120 --output latency.csv
#   3. Measure cgroup + eevdf data with standard tooling:
#      ssh root@<worker> research/cpu-sched/bin/eevdf-observe.sh api-server
#      ssh root@<worker> research/cpu-sched/bin/eevdf-observe.sh db-simulator
#   4. Collect perfetto traces: run-experiment.sh this-config --perfetto --perfetto-config eevdf-deep
#
# See research/cpu-sched/workloads/combined/deploy.yaml for template markers:
#   {{API_CPU_REQUEST}}, {{API_CPU_LIMIT}} — api-server CPU params
#   {{DB_CPU_REQUEST}}, {{DB_CPU_LIMIT}}   — db-simulator CPU params
