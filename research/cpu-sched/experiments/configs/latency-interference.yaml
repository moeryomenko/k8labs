experiment:
  name: latency-interference
  description: "Latency interference — api-server LS pod co-located with a stress-ng batch pod, LS request/limit swept across QoS classes with latency_load generation."
replicates: 3
pre_warm: 15
duration: 120
cooldown: 20
# Family D (latency-interference): an api-server "latency-sensitive" pod
# (image 192.168.124.1:5000/k8labs/api-server:v1) co-located with a stress-ng
# batch pod. The matrix sweeps the LS pod's request/limit across QoS classes
# while the batch pod stays fixed at 1000m/2000m:
#   1. ls 500m/500m    (Guaranteed)  batch 1000m/2000m
#   2. ls 250m/1000m   (Burstable)   batch 1000m/2000m
#   3. ls 500m/1000m   (Burstable)   batch 1000m/2000m
#   4. ls none/none    (BestEffort)  batch 1000m/2000m
#
# Pod names are deliberately NOT latency-sensitive/batch (workload types
# contract: those exact names trigger the runner's legacy 2-pod path and
# suppress the generic N-pod deployment lines that the deployment-count
# assertion checks).
#
# The TOP-LEVEL latency_load block (NOT per-pod; per-pod latency_load is not
# parsed) drives the latency-recording generator wiring. Keys:
#   rate / duration / endpoints   (rate is the presence probe)
# The runner writes latency.csv into each replicate dir when the block exists.
#
# RUN MODE: the Makefile target runs this WITHOUT --eevdf (lighter). For
# scheduler metrics add --eevdf; for kernel tracing use
#   --perfetto --perfetto-config eevdf-deep
# The latency analysis (latency-analyze.py) needs latency.csv plus
# optional eevdf/perfetto data.
workloads:
  ls-api:
    type: api-server
  batch-stress:
    type: stress-ng
    params:
      cores: 2
      load: 100
latency_load:
  rate: 50
  duration: 120
  endpoints: "users:30,orders:30,search:20,reports:20"
measurement:
  cgroup_interval: 5
matrix:
  - ls-api_request: "500m"; ls-api_limit: "500m"; batch-stress_request: "1000m"; batch-stress_limit: "2000m"
  - ls-api_request: "250m"; ls-api_limit: "1000m"; batch-stress_request: "1000m"; batch-stress_limit: "2000m"
  - ls-api_request: "500m"; ls-api_limit: "1000m"; batch-stress_request: "1000m"; batch-stress_limit: "2000m"
  - ls-api_request: ""; ls-api_limit: ""; batch-stress_request: "1000m"; batch-stress_limit: "2000m"
