experiment:
  name: dist-qos-hierarchy
  description: "Family C (dist-qos-hierarchy): guaranteed/burstable/besteffort stress-ng pods co-located on w1, CPU share vs request/limit. 3 cells x 3 replicates. Must be run with --eevdf --perfetto --perfetto-config eevdf-deep."
node: w1
replicates: 3
pre_warm: 10
duration: 90
cooldown: 10
# Family C: three stress-ng pods, one per QoS
# class, sharing node w1. The QoS class comes from the request/limit VALUES,
# not from the workload type (workload types contract). The guaranteed pod
# uses the stress-ng-guaranteed template (memory request==limit 128Mi
# hardcoded) so the pod is classified TRUE Guaranteed; burstable/besteffort
# use type stress-ng.
#   guaranteed  -> request == limit (CPU matrix-driven equal values + 128Mi/128Mi)
#   burstable   -> request < limit
#   besteffort  -> no request, no limit
#
# Matrix keys follow the runner's generic N-pod mapping
# <podname>_request / <podname>_limit. Pod names are deliberately
# hyphen-free (guaranteed/burstable/besteffort) so the summary cell labels
# come out as <qos>-<cell> (runner pattern <wpod>-<cell>), which is exactly
# what the Family C per-QoS rows expect.
#
# NOTE: run with --eevdf --perfetto --perfetto-config eevdf-deep — this
# family measures EEVDF weight-share metrics plus a Perfetto eevdf-deep trace
# per cell (spec section 3.0: every cell runs with both; no cell without a
# trace).
#
# MANUAL STEP: the runner does not yet capture the cgroup hierarchy
# snapshot. After each cell, capture it per node manually:
#   research/bin/cgroup-hierarchy-snapshot.sh <node-ip> \
#     > <data-dir>/<cell>/cgroup-hierarchy-<node>.json
# The runner is NOT modified for this; the manual capture is documented here
# until the runner grows a capture hook.
workloads:
  guaranteed:
    type: stress-ng-guaranteed
    params:
      cores: 2
      load: 100
  burstable:
    type: stress-ng
    params:
      cores: 2
      load: 100
  besteffort:
    type: stress-ng
    params:
      cores: 2
      load: 100
measurement:
  cgroup_interval: 5
matrix:
  - guaranteed_request: "500m"; guaranteed_limit: "500m"; burstable_request: "500m"; burstable_limit: "2000m"; besteffort_request: ""; besteffort_limit: ""
  - guaranteed_request: "1000m"; guaranteed_limit: "1000m"; burstable_request: "250m"; burstable_limit: "1000m"; besteffort_request: ""; besteffort_limit: ""
  - guaranteed_request: "250m"; guaranteed_limit: "250m"; burstable_request: "250m"; burstable_limit: "1000m"; besteffort_request: ""; besteffort_limit: ""
