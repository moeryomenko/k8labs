# Latency-sensitive workload (cpu-burner image)
# Template markers {{CPU_REQUEST}} and {{CPU_LIMIT}} are replaced at deployment.
apiVersion: v1
kind: Pod
metadata:
  name: latency-sensitive
  labels:
    app: latency-sensitive
spec:
  restartPolicy: Never
  containers:
    - name: cpu-burner
      image: 192.168.124.1:5000/k8labs/cpu-burner:v1
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8080
          name: http
      readinessProbe:
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 2
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10
      resources:
        requests:
          cpu: "{{CPU_REQUEST}}"
        limits:
          cpu: "{{CPU_LIMIT}}"
