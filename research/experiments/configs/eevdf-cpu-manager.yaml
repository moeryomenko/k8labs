experiment:
  name: eevdf-cpu-manager
  description: "CPU manager policy comparison (none vs static) — requires cluster reconfiguration between runs"
replicates: 3
pre_warm: 15
duration: 120
cooldown: 20
workload:
  type: cpu-burner
  params:
    endpoint: /fibonacci?n=38
measurement:
  cgroup_interval: 5
matrix:
  - request: "500m"; limit: "500m"
  - request: "200m"; limit: "500m"
