experiment:
  name: eevdf-db-baseline
  description: "DB simulator baseline — CPU profile under different query mix configurations"
replicates: 3
pre_warm: 15
duration: 120
cooldown: 15
workload:
  type: cpu-burner
  params:
    endpoint: /fibonacci?n=38
measurement:
  cgroup_interval: 5
matrix:
  - request: ""; limit: ""
  - request: "500m"; limit: "1000m"
  - request: "1000m"; limit: "2000m"
