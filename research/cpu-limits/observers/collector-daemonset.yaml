apiVersion: v1
kind: ServiceAccount
metadata:
  name: cpu-limits-collector
  namespace: cpu-limits
  labels:
    app.kubernetes.io/name: cpu-limits-collector
    app.kubernetes.io/component: observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cpu-limits-collector
  namespace: cpu-limits
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cpu-limits-collector
  namespace: cpu-limits
subjects:
  - kind: ServiceAccount
    name: cpu-limits-collector
    namespace: cpu-limits
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cpu-limits-collector
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cpu-limits-collector
  namespace: cpu-limits
  labels:
    app.kubernetes.io/name: cpu-limits-collector
    app.kubernetes.io/component: observer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cpu-limits-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpu-limits-collector
        app.kubernetes.io/component: observer
    spec:
      serviceAccountName: cpu-limits-collector
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        cpu-limits/research: collector
      containers:
        - name: collector
          image: ghcr.io/eryoma/k8labs-cpu-limits-collector:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["--host", "0.0.0.0", "--port", "9100"]
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              add: ["DAC_READ_SEARCH"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: debugfs
              mountPath: /host/sys/kernel/debug
              readOnly: true
            - name: tracing
              mountPath: /host/sys/kernel/tracing
              readOnly: true
            - name: boot
              mountPath: /host/boot
              readOnly: true
            - name: modules
              mountPath: /host/lib/modules
              readOnly: true
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: tracing
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
        - name: boot
          hostPath:
            path: /boot
            type: Directory
        - name: modules
          hostPath:
            path: /lib/modules
            type: Directory
