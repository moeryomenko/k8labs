apiVersion: v1
kind: Pod
metadata:
  name: nginx-heavy
  labels:
    app: nginx
    config: heavy
spec:
  containers:
  - name: nginx
    image: nginx:1.25-alpine
    ports:
    - containerPort: 80
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    # Heavy: Very low request and limit → ~70% throttling expected
