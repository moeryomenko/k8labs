apiVersion: v1
kind: Pod
metadata:
  name: nginx-moderate
  labels:
    app: nginx
    config: moderate
spec:
  containers:
  - name: nginx
    image: nginx:1.25-alpine
    ports:
    - containerPort: 80
    resources:
      requests:
        cpu: "500m"
        memory: "256Mi"
      limits:
        cpu: "2000m"
        memory: "512Mi"
    # Moderate: Low request, moderate limit → ~50% throttling expected
