apiVersion: v1
kind: Pod
metadata:
  name: nginx-baseline
  labels:
    app: nginx
    config: baseline
spec:
  containers:
  - name: nginx
    image: nginx:1.25-alpine
    ports:
    - containerPort: 80
    resources:
      requests:
        cpu: "2000m"
        memory: "256Mi"
      limits:
        cpu: "4000m"
        memory: "512Mi"
    # Baseline: High request, high limit → No throttling expected
