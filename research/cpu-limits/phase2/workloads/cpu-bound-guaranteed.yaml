# CPU-bound workload with Guaranteed QoS
#
# This workload performs pure CPU computation with 2 CPU request and limit.
# Expected behavior:
# - cpu.weight derived from 2 CPU request
# - cpu.max = 200000 100000 (2 CPUs)
# - Should be throttled when attempting to use >2 CPUs
# - Shows hard limit enforcement
apiVersion: v1
kind: Pod
metadata:
  name: cpu-bound-guaranteed
  namespace: cpu-limits-research
  labels:
    workload-type: cpu-bound
    qos-class: guaranteed
    app: research-workload
spec:
  nodeSelector:
    cpu-limits/research: collector
  containers:
  - name: stress-ng
    image: docker.io/alexeiled/stress-ng:latest
    command:
    - stress-ng
    - --cpu=4
    - --cpu-method=ackermann
    - --metrics-brief
    - --timeout=120s
    - --verbose
    resources:
      requests:
        cpu: "2"
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 256Mi
  restartPolicy: Never
