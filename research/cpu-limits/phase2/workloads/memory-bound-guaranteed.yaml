# Memory-bound workload with Guaranteed QoS
#
# This workload performs memory-intensive operations (stress-ng --vm).
# Expected behavior:
# - Moderate CPU usage for memory operations
# - Cache misses and memory bandwidth as bottleneck, not CPU throttling
# - Demonstrates that CPU limits don't account for memory access latency
# - Should see higher system CPU time due to page faults
apiVersion: v1
kind: Pod
metadata:
  name: memory-bound-guaranteed
  namespace: cpu-limits-research
  labels:
    workload-type: memory-bound
    qos-class: guaranteed
    app: research-workload
spec:
  nodeSelector:
    cpu-limits/research: collector
  containers:
  - name: stress-ng
    image: docker.io/alexeiled/stress-ng:latest
    command:
    - stress-ng
    - --vm=2
    - --vm-bytes=1G
    - --vm-method=flip
    - --metrics-brief
    - --timeout=120s
    - --verbose
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "1"
        memory: 2Gi
  restartPolicy: Never
