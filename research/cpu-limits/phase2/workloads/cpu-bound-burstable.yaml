# CPU-bound workload with Burstable QoS
#
# This workload has 500m CPU request but 2 CPU limit.
# Expected behavior:
# - cpu.weight derived from 500m request
# - cpu.max = 200000 100000 (2 CPU limit)
# - Can use <500m without contention
# - Gets throttled at 2 CPU limit
# - Under contention, gets share based on 500m weight
apiVersion: v1
kind: Pod
metadata:
  name: cpu-bound-burstable
  namespace: cpu-limits-research
  labels:
    workload-type: cpu-bound
    qos-class: burstable
    app: research-workload
spec:
  nodeSelector:
    cpu-limits/research: collector
  containers:
  - name: stress-ng
    image: docker.io/alexeiled/stress-ng:latest
    command:
    - /stress-ng
    - --cpu=4
    - --cpu-method=ackermann
    - --metrics-brief
    - --timeout=120s
    - --verbose
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 256Mi
  restartPolicy: Never
