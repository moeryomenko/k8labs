# Prometheus scrape configuration for k8s-bpf-tracer
#
# Add this to your Prometheus configuration

scrape_configs:
  - job_name: 'k8s-bpf-tracer'
    static_configs:
      - targets:
          - '192.168.124.2:9101'  # Node 1
          - '192.168.124.3:9101'  # Node 2
          - '192.168.124.4:9101'  # Node 3
        labels:
          cluster: 'k8labs'
          environment: 'research'
    
    scrape_interval: 10s
    scrape_timeout: 5s
    
    metric_relabel_configs:
      # Add node hostname from target
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: node
        replacement: '$1'
