apiVersion: v1
kind: Pod
metadata:
  name: cpu-bound-light-throttle
  labels:
    workload-type: cpu-bound
    qos-class: burstable
    experiment: phase4-throttling
spec:
  restartPolicy: Never
  containers:
  - name: workload
    image: polinux/stress-ng:latest
    command: ["stress-ng"]
    args:
      - "--cpu"
      - "4"
      - "--cpu-method"
      - "ackermann"
      - "--timeout"
      - "120s"
      - "--metrics-brief"
      - "--verbose"
    resources:
      requests:
        cpu: "1000m"
        memory: "128Mi"
      limits:
        cpu: "3000m"
        memory: "256Mi"
