[package]
name = "bench-loadgen"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Open-loop and closed-loop load generator for the CPU-limit benchmark"

[dependencies]
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
