# OpenTelemetry Collector for the phase 8 campaign.
#
# The contract (`contracts/telemetry-contract.json`) names the signals; this
# file decides where they land. It exposes OTLP to the service and fans out:
#   - Prometheus scrape endpoint for humans, the load generator, and tests
#   - Debug logging for provenance in a research run
#
# The autosizer does not read this Collector directly. Fitter is configured with
# a backend-neutral adapter; this Collector is one possible backend, and the
# benchmark suites ship a Prometheus exporter so the adapter has a concrete
# target in the test cluster.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s
    send_batch_size: 512
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  # The service sets workload identity as resource attributes. Enrich with the
  # Kubernetes identity so a series can be attributed to a pod and namespace
  # even after the Collector hop.
  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.container.name
        - k8s.deployment.name
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      - sources:
          - from: connection

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Emit the original sample timestamps. Without this the exporter replays
    # the last cached value with a fresh scrape timestamp forever, so a stopped
    # workload looks permanently fresh to Prometheus and to fitter.
    send_timestamps: true
    # Expire a series two minutes after its last update so the freshness
    # contract (120s) cannot be satisfied by a frozen value.
    metric_expiration: 2m
    resource_to_telemetry_conversion:
      enabled: true
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, batch]
      exporters: [prometheus, debug]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, batch]
      exporters: [debug]
