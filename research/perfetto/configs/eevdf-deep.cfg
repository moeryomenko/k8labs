# eevdf-deep.cfg — EEVDF scheduler deep-dive trace configuration for k8labs research
#
# This config is optimized for capturing EEVDF (Earliest Eligible Virtual Deadline
# First) scheduler internals. It enables the full set of scheduling tracepoints
# needed for vruntime trajectory analysis, slice distribution, scheduling latency,
# and task migration analysis.
#
# ==============================================================================
# Tracepoint Groups and Their Role in EEVDF Analysis
# ==============================================================================
#
# sched_switch (sched/sched_switch):
#   Context switch events. Captures prev_prio, next_prio, prev_state.
#   Used to compute per-task slice durations (time between consecutive switches),
#   scheduling latency (time from wakeup to switch-in), and context switch rate.
#   Primary data source for scheduling heatmaps and latency ECDFs.
#
# sched_wakeup (sched/sched_wakeup):
#   Task wakeup events. Marks the moment a task is awakened (e.g., by an IRQ or
#   another task). Combined with sched_switch, enables wakeup-to-schedule latency
#   measurement — a key EEVDF responsiveness metric.
#
# sched_waking (sched/sched_waking):
#   Pre-wakeup event. Captures target CPU and priority at wakeup decision time.
#   Useful for understanding wakeup affinity and migration decisions made by
#   the EEVDF scheduler's wakeup preemption logic.
#
# sched_process_wait (sched/sched_process_wait):
#   Task blocking events. Captures the reason a task is going to sleep (waiting
#   on a futex, I/O completion, etc.). Essential for distinguishing voluntary
#   (wait-for-work) from involuntary (preemption/throttling) context switches.
#
# sched_stat_runtime (sched/sched_stat_runtime):
#   **PRIMARY EEVDF DATA SOURCE** — Per-task runtime accounting.
#   Captures se.sum_exec_runtime (total CPU time consumed), wait_runtime (time
#   spent waiting on the runqueue), and vruntime (EEVDF virtual runtime, key
#   for eligibility ordering). The vruntime field is the core EEVDF scheduling
#   metric — used to compute vruntime trajectory, per-task lag (vruntime -
#   min_vruntime), and to observe how CPU limits affect the eligibility ordering.
#
# sched_stat_iowait (sched/sched_stat_iowait):
#   I/O wait delay accounting. Measures time tasks spend waiting for I/O
#   completion. Helps distinguish I/O-bound scheduling delays from CPU
#   contention delays in scheduling latency analysis.
#
# sched_stat_blocked (sched/sched_stat_blocked):
#   Blocked time accounting. Captures total time tasks spend in uninterruptible
#   sleep (D state). Used alongside sched_stat_iowait to fully characterize
#   non-runnable periods.
#
# sched_migrate_task (sched/sched_migrate_task):
#   Task migration events. Tracks when and why tasks move between CPUs.
#   Essential for analyzing EEVDF's load-balancing behavior and the overhead
#   of migration (cache cold, NUMA effects) on 2-vCPU worker nodes.
#
# cpu_frequency (power/cpu_frequency):
#   CPU frequency scaling events. Correlates scheduling events with DVFS
#   state changes. Important for understanding how cpufreq governors interact
#   with EEVDF scheduling decisions under different CPU limit configurations.
#
# cpu_idle (power/cpu_idle):
#   CPU idle state transitions. Tracks C-state entry/exit. Combined with
#   sched_switch, enables analysis of wakeup-from-idle latency — a key
#   metric for latency-sensitive workloads under EEVDF.
#
# linux.process_stats:
#   Per-process CPU and memory accounting. Scans /proc/<pid>/stat at 5s intervals.
#   Provides per-task CPU utilization (%) and RSS/VMSize alongside scheduling
#   tracepoints. Essential for correlating scheduling behavior with actual
#   resource consumption.
#
# linux.sys_stats:
#   System-wide CPU, memory, and disk statistics. Polls /proc/meminfo,
#   /proc/vmstat, and /proc/stat every 5s. Provides system-level context for
#   interpreting scheduling traces (e.g., memory pressure effects on scheduling).
#
# ==============================================================================
# Expected Trace File Size
# ==============================================================================
#
# On a 2-vCPU worker node with moderate scheduling activity:
#   120s capture  ->  ~100-200MB
#   60s capture   ->  ~50-100MB
#   300s capture  ->  ~250-500MB  (may exceed buffer capacity)
#
# Breakdown (120s estimate):
#   sched_switch events:        ~60-120MB  (dominant, ~50K events/s per CPU)
#   sched_stat_runtime events:  ~20-40MB   (per-task accounting)
#   process_stats + sys_stats:  ~10-20MB   (polling overhead)
#   cpu_frequency + cpu_idle:   ~5-10MB    (infrequent on idle-ish systems)
#   Other sched events:         ~5-10MB    (wakeup, migrate, etc.)
#
# Buffer sizing (4 x 512KB = 2MB total, DISCARD policy):
#   WARNING: 512KB per buffer is small. If the trace fills, events will be
#   dropped (DISCARD policy). This is intentional to limit memory usage on
#   512MB RAM worker VMs. For longer captures, increase buffer size or use
#   the full-system.cfg config which has 64MB buffers.
#
# ==============================================================================
# Recommended Usage
# ==============================================================================
#
# With experiment runner (recommended):
#   run-experiment.sh --perfetto --perfetto-config eevdf-deep --duration 120
#
# Manual with tracebox:
#   tracebox --txt -c eevdf-deep.cfg -o trace.perfetto-trace --duration <sec>
#
# Override duration via command line:
#   tracebox --txt -c eevdf-deep.cfg -o trace.perfetto-trace --duration 60
#
# Note: tracebox is preferred over perfetto for Fedora 44.
# ==============================================================================

buffers {
  size_kb: 512
  fill_policy: DISCARD
}
buffers {
  size_kb: 512
  fill_policy: DISCARD
}
buffers {
  size_kb: 512
  fill_policy: DISCARD
}
buffers {
  size_kb: 512
  fill_policy: DISCARD
}

data_sources: {
  config {
    name: "linux.ftrace"
    ftrace_config {
      # Compact sched disabled — need full field fidelity for EEVDF analysis
      # to capture prev_prio, next_prio, prev_state, vruntime, wait_runtime
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_wakeup"
      ftrace_events: "sched/sched_waking"
      ftrace_events: "sched/sched_process_wait"
      ftrace_events: "sched/sched_stat_runtime"
      ftrace_events: "sched/sched_stat_iowait"
      ftrace_events: "sched/sched_stat_blocked"
      ftrace_events: "sched/sched_migrate_task"
      ftrace_events: "power/cpu_frequency"
      ftrace_events: "power/cpu_idle"
    }
  }
}

data_sources: {
  config {
    name: "linux.process_stats"
    process_stats_config {
      scan_all_processes_on_start: true
      record_thread_names: true
    }
  }
}

data_sources: {
  config {
    name: "linux.sys_stats"
    sys_stats_config {
      meminfo_period_ms: 5000
      vmstat_period_ms: 5000
      stat_period_ms: 5000
    }
  }
}

# DURATION_MARKER: Override via --duration <sec> on command line
#                 or edit duration_ms below for permanent change
duration_ms: 120000
