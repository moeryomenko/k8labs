# full-system.cfg — Comprehensive system trace for k8labs research
# Captures: scheduling, CPU frequency, process stats
#
# Usage: tracebox -o trace.perfetto-trace --txt -c full-system.cfg

buffers {
  size_kb: 65536
}

data_sources: {
  config {
    name: "linux.ftrace"
    ftrace_config {
      compact_sched: {
        enabled: true
      }
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_waking"
      ftrace_events: "sched/sched_process_exit"
      ftrace_events: "sched/sched_process_free"
      ftrace_events: "task/task_newtask"
      ftrace_events: "task/task_rename"
      # CPU frequency events
      ftrace_events: "power/cpu_frequency"
      ftrace_events: "power/cpu_idle"
    }
  }
}

data_sources: {
  config {
    name: "linux.process_stats"
    process_stats_config {
      scan_all_processes_on_start: true
      record_thread_names: true
    }
  }
}

data_sources: {
  config {
    name: "linux.syscalls"
    syscalls_config {
      syscall_list: "execve"
      syscall_list: "clone"
      syscall_list: "fork"
      syscall_list: "vfork"
    }
  }
}

duration_ms: 300000
