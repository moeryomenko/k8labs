# scheduling.cfg — CPU scheduling trace configuration for k8labs research
# Captures: sched_switch, sched_waking, process lifecycle
#
# Usage: tracebox -o trace.perfetto-trace --txt -c scheduling.cfg

buffers {
  size_kb: 32768
}

data_sources: {
  config {
    name: "linux.ftrace"
    ftrace_config {
      compact_sched: {
        enabled: true
      }
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_waking"
      ftrace_events: "sched/sched_process_exit"
      ftrace_events: "sched/sched_process_free"
      ftrace_events: "task/task_newtask"
      ftrace_events: "task/task_rename"
    }
  }
}

data_sources: {
  config {
    name: "linux.process_stats"
  }
}

duration_ms: 120000
