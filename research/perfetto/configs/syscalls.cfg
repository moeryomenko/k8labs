# syscalls.cfg — System call trace for k8labs research
# Captures: system calls with scheduling context
#
# Usage: tracebox -o trace.perfetto-trace --txt -c syscalls.cfg

buffers {
  size_kb: 65536
}

data_sources: {
  config {
    name: "linux.ftrace"
    ftrace_config {
      compact_sched: {
        enabled: true
      }
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_waking"
      ftrace_events: "sched/sched_process_exit"
      ftrace_events: "sched/sched_process_free"
      ftrace_events: "task/task_newtask"
      ftrace_events: "task/task_rename"
      # Raw syscall tracepoint (catches all syscalls)
      ftrace_events: "syscalls/sys_enter"
      ftrace_events: "syscalls/sys_exit"
    }
  }
}

data_sources: {
  config {
    name: "linux.process_stats"
  }
}

duration_ms: 60000
