# k8labs sched-core-delta research series Taskfile
#
# Stock 7.3 versus the custom kernel for the sched-core-2026-10-18 series.
# The measured target is a lab worker reached through the control-plane VM;
# results are pulled back to the host data root. See README.md for the protocol
# and interpretation limits.
version: '3'

vars:
  PROJECT_ROOT:
    sh: git rev-parse --show-toplevel 2>/dev/null || pwd
  SCHED_CORE_DELTA_DIR: '{{.TASKFILE_DIR}}'
  EXPERIMENTS_DIR: '{{.SCHED_CORE_DELTA_DIR}}/experiments'
  ANALYSIS_DIR: '{{.SCHED_CORE_DELTA_DIR}}/analysis'
  TESTS_DIR: '{{.SCHED_CORE_DELTA_DIR}}/tests'
  DATA_ROOT:
    sh: |
      if [ -n "${SCHED_CORE_DELTA_DATA_ROOT:-}" ]; then
        printf '%s' "$SCHED_CORE_DELTA_DATA_ROOT"
      elif [ -n "${K8LABS_RESEARCH_DATA_ROOT:-}" ]; then
        printf '%s/sched-core-delta' "$K8LABS_RESEARCH_DATA_ROOT"
      else
        printf '%s/build/research/sched-core-delta' "{{.PROJECT_ROOT}}"
      fi
  REPORT_OUT: '{{.OUT | default "RESULTS-generated.md"}}'

tasks:
  sched-core-delta-check:
    desc: Verify both workers, kernel identity, cgroup v2 and tools
    cmds:
      - '"{{.EXPERIMENTS_DIR}}/run-matrix.sh" --check --arm stock'
      - '"{{.EXPERIMENTS_DIR}}/run-matrix.sh" --check --arm custom'

  sched-core-delta-plan:
    desc: Print the seeded plan for the stock arm without changing anything
    cmd: '"{{.EXPERIMENTS_DIR}}/run-matrix.sh" --plan --arm stock --profile pilot'

  sched-core-delta-pilot:
    desc: Run 3 paired blocks with 1 rep x 3 s (pilot, no verdict)
    cmd: |
      run_id="{{.RUN_ID}}"
      if [ -z "$run_id" ]; then run_id=$(date -u +%Y%m%dT%H%M%SZ); fi
      DATA_ROOT="{{.DATA_ROOT}}" RUN_ID="$run_id" "{{.EXPERIMENTS_DIR}}/run-campaign.sh" \
        --blocks 3 --profile pilot --run-id "$run_id"
      printf 'run: %s/%s\n' "{{.DATA_ROOT}}" "$run_id"

  sched-core-delta-run:
    desc: Run 3 paired blocks with 3 reps x 8 s (confirmatory floor)
    cmd: |
      run_id="{{.RUN_ID}}"
      if [ -z "$run_id" ]; then run_id=$(date -u +%Y%m%dT%H%M%SZ); fi
      DATA_ROOT="{{.DATA_ROOT}}" RUN_ID="$run_id" "{{.EXPERIMENTS_DIR}}/run-campaign.sh" \
        --blocks 3 --profile full --run-id "$run_id"
      printf 'run: %s/%s\n' "{{.DATA_ROOT}}" "$run_id"

  sched-core-delta-analyze:
    desc: Analyze a run (latest by default) into summary.{md,csv,json}
    cmd: |
      if [ -n "{{.RUN_DIR}}" ]; then
        case "{{.RUN_DIR}}" in
          /*) run_dir="{{.RUN_DIR}}" ;;
          *) run_dir="{{.PROJECT_ROOT}}/{{.RUN_DIR}}" ;;
        esac
      elif [ -n "{{.RUN_ID}}" ]; then
        run_dir="{{.DATA_ROOT}}/{{.RUN_ID}}"
      else
        run_dir=$(ls -1dt "{{.DATA_ROOT}}"/*/ 2>/dev/null | head -n1 || true)
      fi
      if [ -z "${run_dir:-}" ] || [ ! -d "$run_dir" ]; then
        echo "ERROR: no run directory under {{.DATA_ROOT}}; run sched-core-delta-pilot or sched-core-delta-run" >&2
        exit 1
      fi
      python3 "{{.ANALYSIS_DIR}}/analyze.py" --run-dir "$run_dir"
      printf 'report: %s/analysis/summary.md\n' "$run_dir"

  sched-core-delta-report:
    desc: Analyze the latest run and write a report (OUT, default RESULTS-generated.md)
    cmds:
      - task: sched-core-delta-analyze
        vars:
          RUN_DIR: '{{.RUN_DIR}}'
          RUN_ID: '{{.RUN_ID}}'
      - cmd: |
          if [ -n "{{.RUN_DIR}}" ]; then
            case "{{.RUN_DIR}}" in
              /*) run_dir="{{.RUN_DIR}}" ;;
              *) run_dir="{{.PROJECT_ROOT}}/{{.RUN_DIR}}" ;;
            esac
          elif [ -n "{{.RUN_ID}}" ]; then
            run_dir="{{.DATA_ROOT}}/{{.RUN_ID}}"
          else
            run_dir=$(ls -1dt "{{.DATA_ROOT}}"/*/ 2>/dev/null | head -n1 || true)
          fi
          if [ -z "${run_dir:-}" ] || [ ! -f "$run_dir/analysis/summary.md" ]; then
            echo "ERROR: analysis did not produce summary.md" >&2
            exit 1
          fi
          {
            echo '<!-- generated by task sched-core-delta-report -->'
            cat "$run_dir/analysis/summary.md"
          } > "{{.SCHED_CORE_DELTA_DIR}}/{{.REPORT_OUT}}"
          echo "results: {{.SCHED_CORE_DELTA_DIR}}/{{.REPORT_OUT}}"

  sched-core-delta-steal:
    desc: Run the governor contrast under controlled host steal (custom nodes only)
    cmd: |
      run_id="{{.RUN_ID}}"
      if [ -z "$run_id" ]; then run_id=$(date -u +%Y%m%dT%H%M%SZ); fi
      DATA_ROOT="{{.DATA_ROOT}}" RUN_ID="$run_id" "{{.EXPERIMENTS_DIR}}/run-steal.sh" \
        --blocks 3 --reps 3 --duration 8 --warmup 2 --run-id "$run_id"
      printf 'run: %s/%s\n' "{{.DATA_ROOT}}" "$run_id"

  sched-core-delta-steal-status:
    desc: Show the host-steal state for the custom worker
    cmd: |
      node=$(kubectl --kubeconfig "{{.PROJECT_ROOT}}/build/kubeconfig" get nodes \
        -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' |
        awk '/-md-custom-/ {print; exit}')
      if [ -z "$node" ]; then
        echo "no custom worker found" >&2
        exit 1
      fi
      "{{.EXPERIMENTS_DIR}}/host-steal.sh" --node "$node" --status

  sched-core-delta-test:
    desc: Run offline tests and linters for the series
    cmd: |
      cd "{{.PROJECT_ROOT}}"
      uv run pytest -q "research/sched-core-delta/tests"
      python3 -m py_compile \
        "{{.EXPERIMENTS_DIR}}/scenarios.py" \
        "{{.EXPERIMENTS_DIR}}/run_matrix.py" \
        "{{.ANALYSIS_DIR}}/analyze.py"
      bash -n "{{.EXPERIMENTS_DIR}}/run-matrix.sh"
      bash -n "{{.EXPERIMENTS_DIR}}/run-campaign.sh"
      bash -n "{{.EXPERIMENTS_DIR}}/run-steal.sh"
      bash -n "{{.EXPERIMENTS_DIR}}/host-steal.sh"
      if command -v shellcheck >/dev/null 2>&1; then
        shellcheck \
          "{{.EXPERIMENTS_DIR}}/run-matrix.sh" \
          "{{.EXPERIMENTS_DIR}}/run-campaign.sh" \
          "{{.EXPERIMENTS_DIR}}/run-steal.sh" \
          "{{.EXPERIMENTS_DIR}}/host-steal.sh"
      else
        echo "shellcheck not installed; skipped"
      fi

  sched-core-delta-data-usage:
    desc: Show the data root size
    cmd: du -sh "{{.DATA_ROOT}}" 2>/dev/null || echo "no data root yet"
