[project]
name = "k8labs-perfetto-analysis"
version = "0.2.0"
description = "Perfetto trace analysis and EEVDF visualization for k8labs research"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
perfetto = ["perfetto>=0.57"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"
