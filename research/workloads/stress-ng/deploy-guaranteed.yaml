# stress-ng TRUE Guaranteed workload — memory hardcoded, CPU matrix-driven
apiVersion: v1
kind: Pod
metadata:
  name: stress-ng-guaranteed
  labels:
    app: stress-ng
spec:
  nodeName: w1
  restartPolicy: Never
  containers:
    - name: stress-ng
      image: 192.168.124.1:5000/k8labs/stress-ng:v1
      imagePullPolicy: IfNotPresent
      env:
        - name: STRESS_NG_CORES
          value: "2"
        - name: STRESS_NG_LOAD
          value: "100"
        - name: STRESS_NG_TIMEOUT
          value: "600s"
      command:
        - stress-ng
        - --cpu
        - $(STRESS_NG_CORES)
        - --cpu-load
        - $(STRESS_NG_LOAD)
        - --timeout
        - $(STRESS_NG_TIMEOUT)
        - --metrics-brief
      resources:
        requests:
          cpu: "{{CPU_REQUEST}}"
          memory: "128Mi"
        limits:
          cpu: "{{CPU_LIMIT}}"
          memory: "128Mi"
