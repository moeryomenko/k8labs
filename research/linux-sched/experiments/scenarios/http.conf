# http — nginx latency under a rate-controlled HTTP load.
#
# Primary outcome: client-observed p99 latency (lower is better).
# The offered rate (__RPS__) is calibrated in an EEVDF pilot and frozen before
# confirmatory runs; every arm uses the same value.

SCENARIO_NAME=http
SCENARIO_DESCRIPTION="nginx + wrk2 fixed-rate HTTP, p99 latency"
WORKLOAD=nginx
PRIMARY_METRIC=latency_p99_ms
PRIMARY_DIRECTION=lower-is-better
DURATION_S=180
WARMUP_S=30

TARGET_HOST=w1
LOAD_HOST=w2

WORKLOAD_MANIFEST=workloads/nginx.yaml
LOAD_COMMAND=wrk2
LOAD_ARGS="-t 2 -c 64 -d __DURATION__s -R __RPS__ --latency http://nginx.default.svc.cluster.local/"
# Reads the load generator's report and prints the p99 latency in ms.
METRIC_COMMAND="wrk2-p99-ms"
PRIMARY_SOURCE=load
