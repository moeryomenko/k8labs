# mixed-http-ffmpeg — latency-sensitive HTTP co-located with a CPU batch job.
#
# Primary outcome: HTTP p99 latency (lower is better) while the FFmpeg batch
# runs on the same worker. Batch throughput is recorded as a secondary outcome
# outside the frozen decision rule.

SCENARIO_NAME=mixed-http-ffmpeg
SCENARIO_DESCRIPTION="nginx p99 with co-located FFmpeg batch"
WORKLOAD=nginx+ffmpeg
PRIMARY_METRIC=latency_p99_ms
PRIMARY_DIRECTION=lower-is-better
DURATION_S=30
WARMUP_S=10

TARGET_HOST=w1
LOAD_HOST=w2

WORKLOAD_MANIFEST=workloads/mixed-http-ffmpeg.yaml
LOAD_COMMAND=wrk2
# This scenario's own Service is `mixed-nginx`; the URL previously named the
# `http` scenario's Service, which no Pod in this scenario backs.
LOAD_ARGS="-t 2 -c 64 -d __DURATION__s -R __RPS__ --latency http://mixed-nginx.default.svc.cluster.local/"
LOAD_READY_PROBE="curl -fsS -o /dev/null --max-time 5 http://mixed-nginx.default.svc.cluster.local/"
METRIC_COMMAND="wrk2-p99-ms"
PRIMARY_SOURCE=load
# Secondary outcome only: the co-located batch throughput. It is recorded beside
# the verdict, never in it.
SECONDARY_METRIC_COMMAND="ffmpeg-fps-window"
SECONDARY_SOURCE=podlog
SECONDARY_DIRECTION=higher-is-better
