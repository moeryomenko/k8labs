# postgres — PostgreSQL throughput under fixed pgbench load.
#
# Primary outcome: transactions per second (higher is better).
# The database volume is restored from the same immutable snapshot before every
# arm; the transaction script and client/thread counts are fixed.

SCENARIO_NAME=postgres
SCENARIO_DESCRIPTION="PostgreSQL + pgbench fixed snapshot, transactions/s"
WORKLOAD=postgres
PRIMARY_METRIC=transactions_per_sec
PRIMARY_DIRECTION=higher-is-better
DURATION_S=180
WARMUP_S=30

TARGET_HOST=w1
LOAD_HOST=w2

WORKLOAD_MANIFEST=workloads/postgres.yaml
LOAD_COMMAND=pgbench
LOAD_ARGS="-c 8 -j 4 -T 180 -P 1 -f /fixtures/transactions.sql"
# Parses pgbench's summary line for the tps figure.
METRIC_COMMAND="pgbench-tps"
PRIMARY_SOURCE=load
