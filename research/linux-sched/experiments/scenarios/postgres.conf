# postgres — PostgreSQL throughput under fixed pgbench load.
#
# Primary outcome: transactions per second (higher is better).
# The database volume is restored from the same immutable snapshot before every
# arm; the transaction script and client/thread counts are fixed.

SCENARIO_NAME=postgres
SCENARIO_DESCRIPTION="PostgreSQL + pgbench fixed snapshot, transactions/s"
WORKLOAD=postgres
PRIMARY_METRIC=transactions_per_sec
PRIMARY_DIRECTION=higher-is-better
DURATION_S=180
WARMUP_S=30

TARGET_HOST=w1
LOAD_HOST=w2

WORKLOAD_MANIFEST=workloads/postgres.yaml
# pgbench runs inside the observer on the load node, so it needs the Service
# name and the password: without an explicit host it tries a local Unix socket
# and fails. The leading assignment survives because the load command is
# executed by `sh -c`. `-b tpcb-like -s 2` uses pgbench's built-in script with
# the row ranges matching the database the Pod initialises (`pgbench -i -s 2`);
# the baked transactions.sql assumed scale 10 and would address rows that do not
# exist.
LOAD_COMMAND="PGPASSWORD=linux-sched pgbench"
LOAD_ARGS="-h postgres.default.svc.cluster.local -p 5432 -U postgres -d bench -s 2 -c 8 -j 4 -T __DURATION__ -P 1 -b tpcb-like"
# Parses pgbench's summary line for the tps figure.
METRIC_COMMAND="pgbench-tps"
PRIMARY_SOURCE=load
