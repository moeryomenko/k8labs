# stress-ng — saturating CPU calibration control.
#
# Not a production-workload result: this scenario validates sustained CPU
# contention and that every scheduler arm makes progress under saturation.
# Primary outcome: stress-ng bogo-ops/s (higher is better).

SCENARIO_NAME=stress-ng
SCENARIO_DESCRIPTION="stress-ng matrixprod saturation control, bogo-ops/s"
WORKLOAD=stress-ng
PRIMARY_METRIC=stress_bogo_ops_per_sec
PRIMARY_DIRECTION=higher-is-better
DURATION_S=30
WARMUP_S=0

TARGET_HOST=w1
LOAD_HOST=

WORKLOAD_MANIFEST=workloads/stress-ng.yaml
METRIC_COMMAND="stress-ng-bogo"
PRIMARY_SOURCE=podlog
