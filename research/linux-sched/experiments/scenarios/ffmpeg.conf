# ffmpeg — software-only x264 encode of a fixed, licensed input clip.
#
# Primary outcome: completed frames per second over a fixed 180-second window
# (higher is better). Hardware acceleration is disabled so the workload runs
# entirely on the guest CPU.

SCENARIO_NAME=ffmpeg
SCENARIO_DESCRIPTION="FFmpeg libx264 software encode, frames/s"
WORKLOAD=ffmpeg
PRIMARY_METRIC=frames_per_sec
PRIMARY_DIRECTION=higher-is-better
DURATION_S=180
WARMUP_S=0

TARGET_HOST=w1
LOAD_HOST=

WORKLOAD_MANIFEST=workloads/ffmpeg.yaml
# Counts encoded frames from the job log over DURATION_S.
METRIC_COMMAND="ffmpeg-fps"
PRIMARY_SOURCE=podlog
