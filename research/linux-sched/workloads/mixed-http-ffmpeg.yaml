apiVersion: v1
kind: Pod
metadata:
  name: linux-sched-mixed
  labels:
    app: linux-sched-mixed
    linux-sched/run: "__ARM__"
    linux-sched/role: target
spec:
  nodeName: __NODE_NAME__
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
    - name: nginx
      image: docker.io/library/nginx:1.27.3-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: "500m"
        limits: {}
    - name: ffmpeg
      image: docker.io/linuxserver/ffmpeg:8.0.1
      command:
        - sh
        - -c
        - >-
          ffmpeg -nostdin -hide_banner -stream_loop -1 -i /fixtures/input.mp4
          -map 0:v:0 -an -c:v libx264 -preset medium -threads 2 -t 180
          -f null -
      resources:
        requests:
          cpu: "500m"
        limits: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mixed-nginx
  labels:
    linux-sched/run: "__ARM__"
spec:
  selector:
    app: linux-sched-mixed
  ports:
    - port: 80
      targetPort: 80
