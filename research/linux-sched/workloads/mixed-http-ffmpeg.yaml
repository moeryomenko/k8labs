apiVersion: v1
kind: Pod
metadata:
  name: linux-sched-mixed
  labels:
    app: linux-sched-mixed
    linux-sched/run: "__ARM__"
    linux-sched/role: target
spec:
  nodeName: __NODE_NAME__
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
    - name: nginx
      image: docker.io/library/nginx:1.27.3-alpine@sha256:814a8e88df978ade80e584cc5b333144b9372a8e3c98872d07137dbf3b44d0e4
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
        failureThreshold: 30
      resources:
        requests:
          cpu: "500m"
        limits:
          cpu: "__CPU_LIMIT__"
    - name: ffmpeg
      image: docker.io/linuxserver/ffmpeg:8.0.1@sha256:c72eaf699cb104e84c5292ee9b2a65bf3110738dec113d7cfcef02d7bc21b056
      # Runs for the scenario's warmup plus measured window (30 s + 180 s), so
      # the batch job is still co-located for the whole measured interval; the
      # secondary throughput is computed over that interval only.
      command:
        - sh
        - -c
        - >-
          timeout --signal=INT 40 ffmpeg -nostdin -hide_banner -stream_loop -1
          -i /fixtures/input.mp4 -map 0:v:0 -an -c:v libx264 -preset medium
          -threads 2 -f null -;
          rc=$?; [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ] || exit "$rc"
      resources:
        requests:
          cpu: "500m"
        limits:
          cpu: "__CPU_LIMIT__"
      volumeMounts:
        - name: fixtures
          mountPath: /fixtures
          readOnly: true
  volumes:
    - name: fixtures
      hostPath:
        path: /var/lib/linux-sched/fixtures
        type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: mixed-nginx
  labels:
    linux-sched/run: "__ARM__"
spec:
  selector:
    app: linux-sched-mixed
  ports:
    - port: 80
      targetPort: 80
