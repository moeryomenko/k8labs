apiVersion: v1
kind: Pod
metadata:
  name: linux-sched-postgres
  labels:
    app: linux-sched-postgres
    linux-sched/run: "__ARM__"
    linux-sched/role: target
spec:
  nodeName: __NODE_NAME__
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
    - name: postgres
      image: docker.io/library/postgres:17.2-alpine
      env:
        - name: POSTGRES_PASSWORD
          value: linux-sched
        - name: POSTGRES_DB
          value: bench
      ports:
        - containerPort: 5432
      resources:
        requests:
          cpu: "1"
        limits: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    linux-sched/run: "__ARM__"
spec:
  selector:
    app: linux-sched-postgres
  ports:
    - port: 5432
      targetPort: 5432
