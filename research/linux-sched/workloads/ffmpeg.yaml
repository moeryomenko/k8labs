apiVersion: v1
kind: Pod
metadata:
  name: linux-sched-ffmpeg
  labels:
    app: linux-sched-ffmpeg
    linux-sched/run: "__ARM__"
    linux-sched/role: target
spec:
  nodeName: __NODE_NAME__
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
    - name: ffmpeg
      image: docker.io/linuxserver/ffmpeg:8.0.1@sha256:c72eaf699cb104e84c5292ee9b2a65bf3110738dec113d7cfcef02d7bc21b056
      command:
        - sh
        - -c
        - >-
          timeout --signal=INT 180 ffmpeg -nostdin -hide_banner -stream_loop -1
          -i /fixtures/input.mp4 -map 0:v:0 -an -c:v libx264 -preset medium
          -threads 2 -f null -;
          rc=$?; [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ] || exit "$rc"
      resources:
        requests:
          cpu: "1"
        limits: {}
      volumeMounts:
        # The clip is baked on the node (Big Buck Bunny, CC-BY 3.0). Read-only
        # and byte-identical for every arm; the encode writes to `-f null -`.
        - name: fixtures
          mountPath: /fixtures
          readOnly: true
  volumes:
    - name: fixtures
      hostPath:
        path: /var/lib/linux-sched/fixtures
        type: Directory
