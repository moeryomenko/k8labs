apiVersion: v1
kind: Pod
metadata:
  name: linux-sched-nginx
  labels:
    app: linux-sched-nginx
    linux-sched/run: "__ARM__"
    linux-sched/role: target
spec:
  nodeName: __NODE_NAME__
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
    - name: nginx
      image: docker.io/library/nginx:1.27.3-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: "1"
        limits: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    linux-sched/run: "__ARM__"
spec:
  selector:
    app: linux-sched-nginx
  ports:
    - port: 80
      targetPort: 80
