apiVersion: v1
kind: Pod
metadata:
  name: linux-sched-nginx
  labels:
    app: linux-sched-nginx
    linux-sched/run: "__ARM__"
    linux-sched/role: target
spec:
  nodeName: __NODE_NAME__
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
    - name: nginx
      image: docker.io/library/nginx:1.27.3-alpine@sha256:814a8e88df978ade80e584cc5b333144b9372a8e3c98872d07137dbf3b44d0e4
      ports:
        - containerPort: 80
      # Without a probe the Pod is Ready as soon as the container runs, so the
      # Service endpoint can appear before nginx accepts connections and the
      # load's first requests fail. Probing the port makes readiness mean
      # "serving".
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
        failureThreshold: 30
      resources:
        requests:
          cpu: "1"
        limits: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    linux-sched/run: "__ARM__"
spec:
  selector:
    app: linux-sched-nginx
  ports:
    - port: 80
      targetPort: 80
