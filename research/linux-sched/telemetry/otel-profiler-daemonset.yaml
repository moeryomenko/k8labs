# OpenTelemetry eBPF Profiler: whole-host CPU profiles exported over OTLP to
# Pyroscope. Runs only on nodes labelled linux-sched/research=observer.
#
# The profiler needs host PID access and read-only access to /proc,
# /sys/kernel, and /lib/modules to unwind stacks. Host root is never mounted.
# Exporter credentials are read from a Secret, never passed as literals.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: linux-sched-otel-profiler
  namespace: research-telemetry
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: linux-sched-otel-profiler-config
  namespace: research-telemetry
data:
  config.yaml: |
    receivers:
      profiling:
        samples_per_second: 97
    exporters:
      otlp:
        endpoint: ${env:PYROSCOPE_OTLP_ENDPOINT}
        tls:
          insecure: false
    service:
      pipelines:
        profiles:
          receivers: [profiling]
          exporters: [otlp]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: linux-sched-otel-profiler
  namespace: research-telemetry
  labels:
    app.kubernetes.io/name: linux-sched-otel-profiler
    app.kubernetes.io/part-of: linux-sched
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: linux-sched-otel-profiler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linux-sched-otel-profiler
        app.kubernetes.io/part-of: linux-sched
    spec:
      serviceAccountName: linux-sched-otel-profiler
      automountServiceAccountToken: false
      hostPID: true
      hostNetwork: false
      tolerations:
        - operator: Exists
      nodeSelector:
        linux-sched/research: observer
      containers:
        - name: profiler
          image: otel/opentelemetry-collector-ebpf-profiler:0.147.0
          args:
            - "--feature-gates=+service.profilesSupport"
            - "--config=/etc/otel/config.yaml"
          env:
            - name: PYROSCOPE_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: linux-sched-telemetry-endpoint
                  key: endpoint
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
            - name: proc
              mountPath: /proc
              readOnly: true
            - name: sys-kernel
              mountPath: /sys/kernel
              readOnly: true
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: linux-sched-otel-profiler-config
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: sys-kernel
          hostPath:
            path: /sys/kernel
            type: Directory
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
