apiVersion: v1
kind: Namespace
metadata:
  name: research-telemetry
  labels:
    # Explicit Pod Security Admission exception: ONLY the two host-observing
    # DaemonSets in this namespace may run privileged. Nothing else is
    # scheduled here; the namespace is node-selected to research workers.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    app.kubernetes.io/part-of: linux-sched
