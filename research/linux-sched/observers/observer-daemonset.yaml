# linux-sched observer DaemonSet.
#
# Runs ONE long-lived observer per research worker. It is deliberately **not**
# privileged: a `privileged: true` Pod cannot start on this lab (cri-o fails
# with `mknodat /dev/loop0: Permission denied`), while a Pod with `hostPID` and
# the capability set below starts normally and can attach BPF programs (verified
# on-host with bpftrace counting sched_switch events).
#
# The observer is a shell that installs the node-native tooling once and then
# idles; the runner drives captures with `kubectl exec` and copies artifacts
# with `kubectl cp`. Results are also readable through `kubectl logs`.
#
# Requires the node label `linux-sched/research=observer`.
apiVersion: v1
kind: Namespace
metadata:
  name: linux-sched
  labels:
    app.kubernetes.io/part-of: linux-sched
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: linux-sched-observer
  namespace: linux-sched
  labels:
    app.kubernetes.io/name: linux-sched-observer
    app.kubernetes.io/part-of: linux-sched
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: linux-sched-observer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linux-sched-observer
        app.kubernetes.io/part-of: linux-sched
    spec:
      hostPID: true
      hostNetwork: false
      hostIPC: false
      automountServiceAccountToken: false
      nodeSelector:
        linux-sched/research: observer
      containers:
        - name: observer
          image: docker.io/library/fedora:44
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              dnf install -y -q bpftrace perf libbpf-tools procps-ng postgresql postgresql-contrib openssl-libs curl
              # Load generators are baked on the node (see the bake's fixture
              # section) and mounted read-only; expose them on PATH. wrk2 links
              # libssl/libcrypto, hence openssl-libs above.
              #
              # bcc-tools and python3-bcc are deliberately absent: the run-queue
              # metrics use the libbpf-tools CO-RE binaries, and the node image
              # still carries the BCC packages for anything that wants them. The
              # node's filesystem is about 5 GiB (see GATES.md), and every
              # package here is written to the node, where kubelet evicts pods
              # for ephemeral storage.
              for t in /opt/linux-sched/bin/*; do
                [ -e "$t" ] && ln -sf "$t" "/usr/local/bin/$(basename "$t")"
              done
              touch /tmp/observer-ready
              exec sleep infinity
          securityContext:
            capabilities:
              add:
                - BPF
                - PERFMON
                - SYS_ADMIN
                - SYS_RESOURCE
                - SYS_PTRACE
                - IPC_LOCK
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/observer-ready"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            # libbpf resolves `kcfg` externs from the kernel config; without it
            # the struct_ops load fails with EINVAL.
            - name: boot
              mountPath: /boot
              readOnly: true
            - name: modules
              mountPath: /lib/modules
              readOnly: true
            - name: src-kernels
              mountPath: /usr/src/kernels
              readOnly: true
            - name: work
              mountPath: /var/tmp/linux-sched
            # Baked workload fixtures and load generators. The FFmpeg input
            # clip and the PostgreSQL snapshot live here, and the Pods mount
            # the same host path, so every arm reads byte-identical inputs.
            - name: fixtures
              mountPath: /fixtures
              readOnly: true
            - name: tools
              mountPath: /opt/linux-sched/bin
              readOnly: true
      volumes:
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: DirectoryOrCreate
        - name: btf
          hostPath:
            path: /sys/kernel/btf
            type: Directory
        - name: boot
          hostPath:
            path: /boot
            type: Directory
        # BCC compiles BPF at runtime against the running kernel's headers; the
        # node image installs kernel-devel for the pinned kernel, and these two
        # mounts expose that tree read-only.
        - name: modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: src-kernels
          hostPath:
            path: /usr/src/kernels
            type: DirectoryOrCreate
        - name: work
          hostPath:
            path: /var/tmp/linux-sched
            type: DirectoryOrCreate
        # Baked at image-bake time. `Directory`, not `DirectoryOrCreate`: an
        # observer without fixtures cannot measure anything, so it should fail
        # to start rather than run and produce empty samples.
        - name: fixtures
          hostPath:
            path: /var/lib/linux-sched/fixtures
            type: Directory
        - name: tools
          hostPath:
            path: /var/lib/linux-sched/bin
            type: Directory
