# Alloy on the research workers: the OTel eBPF profiler, for the OTel campaign.
#
# One pod, on the session's target worker, profiling that node's processes and
# writing to Pyroscope on the host. The session's labels live in the ConfigMap
# (a separate object, rendered per session) and the target in the node selector,
# so a stored profile carries exactly the labels sessions.json recorded for it,
# and comes from the node it names.
#
# This file deliberately contains no ConfigMap: applying both objects together
# overwrote each rendered session configuration with the placeholder, which left
# every session profiling nothing.
#
# Least privilege on purpose: the plan forbids `privileged: true`, and the
# component's documented capability set is enough (see
# https://grafana.com/docs/alloy/latest/reference/components/pyroscope/pyroscope.ebpf/).
# These are the profiles for one node under one scheduler arm, not a measured
# comparison sample: this campaign never runs while the comparison does.
# The rendered manifest is applied per session and then rolled, so the pod's
# template carries nothing session-specific itself.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: linux-sched-otel-alloy
  namespace: linux-sched
  labels:
    app.kubernetes.io/name: linux-sched-otel-alloy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: linux-sched-otel-alloy
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linux-sched-otel-alloy
    spec:
      # The profiler resolves symbols for processes on the node and needs to see
      # them all.
      hostPID: true
      # Pinned to the session's target worker. Profiling every research worker at
      # once would label one node's samples with another node's session, and would
      # also put the profiler beside a comparison block on the load worker.
      nodeSelector:
        kubernetes.io/hostname: __TARGET_NODE__
      tolerations:
        - operator: Exists
      containers:
        - name: alloy
          image: grafana/alloy:v1.20.1@sha256:5133c159d34c7acf37a1b6d91682abcb6b28b2a29bae152ff5cf4753296f956c
          args:
            - run
            # The profiler components sit behind Alloy's experimental level.
            - --stability.level=experimental
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/tmp/alloy
            - --disable-reporting
            - /etc/alloy/config.alloy
          ports:
            - name: http
              containerPort: 12345
          securityContext:
            capabilities:
              # The documented least-privilege set for pyroscope.ebpf.
              add:
                - BPF
                - PERFMON
                - SYS_PTRACE
                - CHECKPOINT_RESTORE
                - SYS_RESOURCE
                - DAC_READ_SEARCH
                - SYSLOG
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: tracing
              mountPath: /sys/kernel/tracing
              readOnly: true
            # The profiler needs writable scratch space for its symbol cache. It
            # is capped so a long session cannot fill the node: these workers have
            # about 5 GiB of root filesystem (see GATES.md).
            - name: symb-cache
              mountPath: /tmp/symb-cache
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: linux-sched-otel-alloy
        - name: tracing
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
        - name: symb-cache
          emptyDir:
            sizeLimit: 512Mi
