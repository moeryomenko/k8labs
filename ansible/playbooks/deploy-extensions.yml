---
- name: Deploy sysext and confext extensions to all cluster nodes
  hosts: cluster
  gather_facts: false
  vars:
    project_dir: "{{ playbook_dir }}/../.."
    sysext_names:
      - cni
      - cri-o
      - crun
      - etcd
      - kubelet
      - kubernetes-cp
      - perfetto
    confext_names:
      - cri-o
      - etcd
      - kubernetes
      - kubernetes-cp
      - worker
  tasks:
    # ---------------------------------------------------------------------------
    # Stage 0 — Node initialization (disk resize, dependencies, configuration)
    # ---------------------------------------------------------------------------
    - name: Resize root partition 3 to fill disk
      community.general.parted:
        device: /dev/vda
        number: 3
        part_end: 100%
        state: present
      register: parted_result
      failed_when: false

    - name: Resize LVM physical volume and filesystem
      ansible.builtin.shell: |
        pvresize /dev/vda3 || true
        ROOT_LV=$(lvs --noheadings -o lv_path | head -1 | tr -d ' ')
        if [ -n "$ROOT_LV" ]; then
          lvextend -l +100%FREE "$ROOT_LV" || true
          resize2fs "$ROOT_LV" || true
        fi
      changed_when: true
      failed_when: false

    - name: Install container runtime dependencies (conmon, tar)
      ansible.builtin.dnf:
        name:
          - conmon
          - tar
        state: present

    - name: Install rsync for sysext/confext synchronize
      ansible.builtin.dnf:
        name: rsync
        state: present

    - name: Check if ebpf-fix SELinux module is already installed
      ansible.builtin.command:
        cmd: semodule -l 2>/dev/null
      register: semodule_check
      changed_when: false
      failed_when: false

    - name: Copy SELinux policy module for eBPF device filter
      ansible.builtin.copy:
        src: "{{ project_dir }}/extensions/selinux/ebpf-fix.pp"
        dest: /tmp/ebpf-fix.pp
        mode: "0644"
      when: "'ebpf-fix' not in semodule_check.stdout"

    - name: Install SELinux policy module for eBPF
      ansible.builtin.command:
        cmd: semodule -i /tmp/ebpf-fix.pp
      when: "'ebpf-fix' not in semodule_check.stdout"

    - name: Create /etc/containers directory
      ansible.builtin.file:
        path: /etc/containers
        state: directory
        mode: "0755"

    - name: Create containers policy.json for image pulling
      ansible.builtin.copy:
        dest: /etc/containers/policy.json
        content: |
          {
            "default": [
              {
                "type": "insecureAcceptAnything"
              }
            ]
          }
        mode: "0644"
      force: false

    - name: Set correct hostname from inventory
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Create /etc/kubernetes directories upfront
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/kubernetes/pki
        - /etc/kubernetes/manifests
        - /var/lib/kubelet/pki

    - name: Purge any existing sysext/confext binaries to avoid stale binaries
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/bin/crio
        - /usr/bin/crun
        - /usr/bin/kubelet
        - /usr/bin/etcd
        - /usr/bin/etcdctl
        - /usr/bin/kube-apiserver
        - /usr/bin/kube-controller-manager
        - /usr/bin/kube-scheduler
        - /usr/bin/kubectl
        - /usr/lib/systemd/system/crio.service
        - /usr/lib/systemd/system/kubelet.service
        - /usr/lib/systemd/system/etcd.service
        - /usr/lib/systemd/system/kube-apiserver.service
        - /usr/lib/systemd/system/kube-controller-manager.service
        - /usr/lib/systemd/system/kube-scheduler.service

    - name: Deploy sysexts to all nodes
      ansible.posix.synchronize:
        src: "{{ project_dir }}/sysext/{{ item }}/"
        dest: /
      loop: "{{ sysext_names }}"

    - name: Deploy confexts to all nodes
      ansible.posix.synchronize:
        src: "{{ project_dir }}/confext/{{ item }}/"
        dest: /
      loop: "{{ confext_names }}"

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Disable swap check in kubelet config
      ansible.builtin.replace:
        path: /etc/kubernetes/kubelet/config.yaml
        regexp: 'failSwapOn: true'
        replace: 'failSwapOn: false'
      failed_when: false

    - name: Start CRI-O container runtime
      ansible.builtin.systemd:
        name: crio
        state: started

    - name: Verify binaries exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/bin/crio
        - /usr/bin/crun
        - /usr/bin/kubelet
        - /usr/bin/etcd
        - /usr/bin/etcdctl
        - /usr/bin/kube-apiserver
        - /usr/bin/kube-controller-manager
        - /usr/bin/kube-scheduler
        - /usr/bin/kubectl
      register: binary_stats

    - name: Display binary verification
      ansible.builtin.debug:
        msg: |-
          {% for r in binary_stats.results %}
          {{ 'OK' if r.stat.exists and r.stat.executable else 'MISSING' }}: {{ r.item }}
          {% endfor %}
