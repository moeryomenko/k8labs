---
# gateway-api-crds — Install Gateway API v1.6.1 CRDs
# Applied before Cilium install so Cilium can reconcile them.
# Uses raw + delegate_to to avoid Python dependency on the controller.

- name: Apply GatewayClass CRD
  ansible.builtin.raw: >
    kubectl apply -f {{ gateway_api_crd_base_url }}/gateway.networking.k8s.io_gatewayclasses.yaml
    --kubeconfig {{ project_dir }}/kubeconfig
  delegate_to: localhost
  run_once: true
  register: gw_class_crd
  changed_when: '"created" in gw_class_crd.stdout or "configured" in gw_class_crd.stdout'

- name: Apply Gateway CRD
  ansible.builtin.raw: >
    kubectl apply -f {{ gateway_api_crd_base_url }}/gateway.networking.k8s.io_gateways.yaml
    --kubeconfig {{ project_dir }}/kubeconfig
  delegate_to: localhost
  run_once: true
  register: gw_crd
  changed_when: '"created" in gw_crd.stdout or "configured" in gw_crd.stdout'

- name: Apply HTTPRoute CRD
  ansible.builtin.raw: >
    kubectl apply -f {{ gateway_api_crd_base_url }}/gateway.networking.k8s.io_httproutes.yaml
    --kubeconfig {{ project_dir }}/kubeconfig
  delegate_to: localhost
  run_once: true
  register: httproute_crd
  changed_when: '"created" in httproute_crd.stdout or "configured" in httproute_crd.stdout'

- name: Apply ReferenceGrant CRD
  ansible.builtin.raw: >
    kubectl apply -f {{ gateway_api_crd_base_url }}/gateway.networking.k8s.io_referencegrants.yaml
    --kubeconfig {{ project_dir }}/kubeconfig
  delegate_to: localhost
  run_once: true
  register: refgrant_crd
  changed_when: '"created" in refgrant_crd.stdout or "configured" in refgrant_crd.stdout'

- name: Apply GRPCRoute CRD
  ansible.builtin.raw: >
    kubectl apply -f {{ gateway_api_crd_base_url }}/gateway.networking.k8s.io_grpcroutes.yaml
    --kubeconfig {{ project_dir }}/kubeconfig
  delegate_to: localhost
  run_once: true
  register: grpcroute_crd
  changed_when: '"created" in grpcroute_crd.stdout or "configured" in grpcroute_crd.stdout'

- name: Apply BackendTLSPolicy CRD
  ansible.builtin.raw: >
    kubectl apply -f {{ gateway_api_crd_base_url }}/gateway.networking.k8s.io_backendtlspolicies.yaml
    --kubeconfig {{ project_dir }}/kubeconfig
  delegate_to: localhost
  run_once: true
  register: btls_crd
  changed_when: '"created" in btls_crd.stdout or "configured" in btls_crd.stdout'

- name: Wait for Gateway API CRDs to be established
  ansible.builtin.raw: >
    kubectl wait --for condition=established
    crd/gatewayclasses.gateway.networking.k8s.io
    crd/gateways.gateway.networking.k8s.io
    crd/httproutes.gateway.networking.k8s.io
    crd/referencegrants.gateway.networking.k8s.io
    crd/grpcroutes.gateway.networking.k8s.io
    crd/backendtlspolicies.gateway.networking.k8s.io
    --timeout=60s
    --kubeconfig {{ project_dir }}/kubeconfig
  delegate_to: localhost
  run_once: true
  register: gw_crd_wait
  changed_when: false
  retries: 3
  delay: 5
  until: gw_crd_wait is succeeded
