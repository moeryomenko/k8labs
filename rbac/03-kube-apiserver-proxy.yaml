# Grant the kube-apiserver proxy user node access (nodes/proxy) so the
# apiserver can proxy exec/port-forward requests to nodes (used by Cilium
# health checks) — ported verbatim from ansible/playbooks/bootstrap.yml:232-256
# (Stage 5).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:kube-apiserver-proxy
rules:
- apiGroups: [""]
  resources: ["nodes/proxy"]
  verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:kube-apiserver-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kube-apiserver-proxy
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: kubernetes
# The apiserver talks to kubelets with the CN on --kubelet-client-certificate
# (/etc/kubernetes/pki/kubernetes.pem), which on this image authenticates as
# `kube-apiserver`, not `kubernetes`. Without this subject every kubectl
# logs/exec (and Cilium's node-proxy health checks) fails with Forbidden on
# nodes/proxy.
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: kube-apiserver
