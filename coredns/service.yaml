# kube-dns Service — selects coredns pods. The clusterIP (10.96.0.10) is
# pre-allocated by the provider's workload seed before node configs render
# (matching the kubelet clusterDNS), so this manifest deliberately does NOT
# pin a clusterIP: the CRS apply collides on the Service name with the
# pre-allocated one (AlreadyExists, treated as success) instead of tripping
# the apiserver IP allocator on an already-allocated explicit IP.
apiVersion: v1
kind: Service
metadata:
  name: kube-dns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
    kubernetes.io/cluster-service: "true"
    kubernetes.io/name: CoreDNS
spec:
  selector:
    k8s-app: kube-dns
  ports:
    - name: dns
      port: 53
      protocol: UDP
      targetPort: 53
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
    - name: metrics
      port: 9153
      protocol: TCP
      targetPort: 9153
