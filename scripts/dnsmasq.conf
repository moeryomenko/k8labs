# dnsmasq.conf — DHCP/DNS server for the k8sbr0 bridge
# Started via create-taps.sh using --keep-in-foreground

# Interface to listen on
interface=k8sbr0

# Bind only to the bridge interface (don't expose to other interfaces)
bind-interfaces

# DHCP range: 192.168.124.20 - 192.168.124.200, lease time 12 hours
# Static IP range: 192.168.124.10-19 (reserved for Packer build, etc.)
dhcp-range=192.168.124.20,192.168.124.200,12h

# DHCP options
dhcp-option=option:netmask,255.255.255.0
dhcp-option=option:router,192.168.124.1
dhcp-option=option:dns-server,192.168.124.1

# Domain name served to DHCP clients
domain=k8s.local

# DHCP reservations (MAC → fixed IP)
# Packer build VM
dhcp-host=de:ad:be:ef:00:01,192.168.124.10
# Cluster VMs (reserved for future use)
# dhcp-host=c6:e5:50:1c:ec:01,192.168.124.11  # k8s-cp-1

# Lease file
dhcp-leasefile=/var/lib/misc/dnsmasq/k8sbr0.leases

# Forward DNS queries to system resolvers (/etc/resolv.conf)
# (no server= directive means forward to default resolvers)

# Do NOT run as daemon — started with --keep-in-foreground via nohup
# (no daemon directive here)
