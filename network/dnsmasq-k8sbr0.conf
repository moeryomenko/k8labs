# DNS forwarder for the k8sbr0 bridge network
#
# systemd-networkd's built-in DHCP server hands out 192.168.124.1 as the
# DNS server (see network/k8sbr0.network), but the host does not run a
# DNS forwarder on the bridge address by default. This dnsmasq config
# provides DNS resolution for cluster VMs.
#
# Dynamic binding: dnsmasq binds to the k8sbr0 address when it appears,
# tolerating the bridge coming up AFTER dnsmasq starts (e.g., boot
# ordering) instead of failing at start time. Combined with
# interface=k8sbr0 / listen-address=192.168.124.1 it keeps dnsmasq OFF
# the wildcard 0.0.0.0:53 and [::]:53 sockets — those would expose an
# accidental open resolver on the LAN.
#
# Activation: this file is inert unless /etc/dnsmasq.conf has an ACTIVE
# (uncommented) conf-dir line for /etc/dnsmasq.d/. `make network-up`
# enables conf-dir=/etc/dnsmasq.d/,*.conf idempotently (uncomment the
# stock commented line, or append if absent) before restarting dnsmasq.
#
# Install: sudo cp network/dnsmasq-k8sbr0.conf /etc/dnsmasq.d/k8sbr0.conf
#          sudo systemctl enable --now dnsmasq

interface=k8sbr0
bind-dynamic
listen-address=192.168.124.1
except-interface=lo
no-dhcp-interface=k8sbr0
domain-needed
bogus-priv
no-resolv
server=1.1.1.1
server=8.8.8.8
