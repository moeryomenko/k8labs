# kind management cluster for the k8labs rootless-Podman lab.
# The node image is digest-pinned in versions.lock.yaml. The host API port is
# intentionally dynamically selected by kind; workload forwarding reserves 6443.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8labs-mgmt
# kind's pinned node image includes kindnet for management-cluster networking.
# Cilium remains a workload-cluster addon; retaining kindnet avoids requiring
# privileged BPF mounts inside rootless Podman nodes during bootstrap.
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
