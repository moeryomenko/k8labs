# Gateway resource using the Cilium GatewayClass.
# Exposes an HTTP listener on port 80 using the L2 LB pool (10.0.10.0/24).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium-gw
  namespace: default
spec:
  gatewayClassName: cilium
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
